name: Reset backend password

# Run this if you cannot get into the app any more. It clears the lock on the
# backend without touching your API key, links, caches or rendered videos.
# Actions tab -> "Reset backend password" -> "Run workflow".
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --upgrade modal

      - name: Clear the password
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          RESULT=$(python - <<'PY'
          import modal
          fn = modal.Function.from_name("arm-pipeline", "reset_password")
          print(fn.remote())
          PY
          )
          echo "$RESULT"
          echo "### $RESULT" >> $GITHUB_STEP_SUMMARY
