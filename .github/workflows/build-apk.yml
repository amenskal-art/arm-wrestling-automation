name: Build Android APK

# Builds the phone app in the cloud and attaches the APK to the run, so you
# never need Android Studio or a PC. Download it from the run's Artifacts
# section on your phone and open it to install.
#
# MANUAL ONLY. Editing files never starts a build. To build one:
#   Actions tab -> "Build Android APK" -> "Run workflow"
# An APK build takes ~3 minutes of runner time, so it only runs when you ask.
on:
  workflow_dispatch:

# Publishing a release needs write access to the repo. New repositories give
# workflows a read-only token by default, which is what produces
# "Resource not accessible by integration" on the release step.
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build the APK
        id: build
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee ../build.log

      # Gradle buries the real cause under 80 lines of its own stack trace.
      # Kotlin reports every problem on a line starting with "e:", so pull
      # exactly those out and put them where they are easy to read and copy.
      - name: Show the compile errors
        if: failure()
        run: |
          echo "## Compile errors" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if grep -q "^e: " build.log; then
            grep "^e: " build.log | sed 's|file:///home/runner/work/[^/]*/[^/]*/||' \
              | tee -a $GITHUB_STEP_SUMMARY
          else
            echo "No Kotlin errors found. Last 40 lines of the build:" \
              | tee -a $GITHUB_STEP_SUMMARY
            grep -v "^\s*at " build.log | tail -40 | tee -a $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo ""
          echo "The block above is also at the top of this run's summary page."

      - name: Keep the full log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: arm-pipeline-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Also publish a rolling release so the APK has a stable download link
      # you can bookmark on your phone. The artifact above is the guaranteed
      # copy, so a publishing hiccup never marks a good build as failed.
      - name: Publish to the latest release
        if: github.ref == 'refs/heads/main'   # only when run from the main branch
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Arm Pipeline APK (latest)
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
